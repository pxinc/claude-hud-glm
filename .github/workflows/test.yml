name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun run test
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jarrodwatts/claude-hud
          ref: a235aa9e05e6b988a70dc54cf78fcbf6e98853c2
          path: .upstream-hud
      - run: bun check-upstream.mjs
        env:
          CLAUDE_HUD_SOURCE: ${{ github.workspace }}/.upstream-hud
